name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  lint-typescript:
    name: Lint & Format (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  brand-identity:
    name: Brand Identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Fails when a new upstream-brand reference appears outside the recorded
      # baseline — the usual source being an upstream sync. No dependencies
      # needed; the checker only reads tracked files.
      - name: Check brand identity
        run: node scripts/check-brand-identity.mjs

  test-foundation:
    name: Test (Outpost foundation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: packages/outpost-worker/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build foundation packages
        run: npm run build:foundation

      - name: Run foundation tests (protocol, homestead, Go worker)
        run: npm run test:foundation

      - name: Go worker race detector
        run: go test -race ./...
        working-directory: packages/outpost-worker

  typecheck-typescript:
    name: TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: TypeCheck all packages
        run: npm run typecheck

  build-web:
    name: Build (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Build web package
        run: npm run build -w @open-inspect/web

  test-cp-unit:
    name: Test (control-plane unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typescript, typecheck-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build control-plane dependencies
        run: |
          npm run build -w @open-inspect/shared
          npm run build -w @openoutposts/outpost-protocol

      - name: Run shared tests
        run: npm test -w @open-inspect/shared

      - name: Run control-plane unit tests
        run: npm test -w @open-inspect/control-plane

  test-cp-integration:
    name: Test (control-plane integration)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typescript, typecheck-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build control-plane dependencies
        run: |
          npm run build -w @open-inspect/shared
          npm run build -w @openoutposts/outpost-protocol

      - name: Install workerd runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libc++1

      - name: Run control-plane integration tests
        run: npm run test:integration -w @open-inspect/control-plane

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typescript, typecheck-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run web tests
        run: npm test -w @open-inspect/web

  test-bots:
    name: Test (bots)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typescript, typecheck-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run github-bot tests
        run: npm test -w @open-inspect/github-bot

      - name: Run slack-bot tests
        run: npm test -w @open-inspect/slack-bot

      - name: Run linear-bot tests
        run: npm test -w @open-inspect/linear-bot
